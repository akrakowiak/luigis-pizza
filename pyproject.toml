[project]
name = "luigis-pizza"
version = "0.1.0"
description = "Luigi's Pizza"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.4",
    "jinja2>=3.1.4",
    "pre-commit>=4.0.1",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.6.0",
    "pydantic>=2.9.2",
    "pytailwindcss>=0.2.0",
    "pyyaml>=6.0.2",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = true

[tool.ruff.lint]
select = ["I"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]

[project.scripts]
dev = "app.main:dev"
prod = "app.main:main"
